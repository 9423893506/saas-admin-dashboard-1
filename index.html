<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SaaS Admin Dashboard</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e8eef9;font:16px system-ui;min-height:100vh}
header{padding:24px 6%;border-bottom:1px solid #243047;display:flex;justify-content:space-between;align-items:center}
main{max-width:1050px;margin:35px auto;padding:0 20px}h1{font-size:clamp(28px,5vw,44px);margin:0 0 10px}p{color:#9fb0ca}
.card{background:#121c2e;border:1px solid #273650;border-radius:16px;padding:20px;margin:14px 0}
